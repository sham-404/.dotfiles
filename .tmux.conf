##### -------------------------------
##### Core behavior
##### -------------------------------

# Truecolor and proper terminal description
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Faster key response
set -sg escape-time 0

# Scrollback
set -g history-limit 50000

# Mouse
set -g mouse on


##### -------------------------------
##### Prefix key
##### -------------------------------

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


##### -------------------------------
##### Splits like Neovim
##### -------------------------------

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"


##### -------------------------------
##### Vim-like pane navigation
##### -------------------------------

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


##### -------------------------------
##### Vim-like copy & paste
##### -------------------------------

setw -g mode-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# In copy mode: v to start selection, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Paste with prefix + p
bind p paste-buffer


##### -------------------------------
##### Status bar styling
##### -------------------------------

set -g status-position bottom
set -g status-interval 2

# Background and text
set -g status-style "bg=#1b1d2b,fg=#c0caf5"

# Left: session
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold] 󰆍 #S "

# Windows
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#1b1d2b,bg=#7aa2f7,bold] #I:#W "

# Right: date and time
set -g status-right-length 60
set -g status-right "#[fg=#9ece6a] %H:%M #[fg=#7dcfff]%d-%b-%Y "

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"


##### -------------------------------
##### Quality-of-life
##### -------------------------------

# New window in current path
bind c new-window -c "#{pane_current_path}"


##### -------------------------------
##### Neovim color correctness
##### -------------------------------

# Ensures apps see truecolor correctly
set -as terminal-features ',xterm-256color:RGB'
